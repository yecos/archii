name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx next lint

      - name: Check TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Build
        run: npx next build
        env:
          NODE_ENV: production

  inventory-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Inventory concurrency, isolation and Firestore rules
        run: npm run test:inventory:integration
      - name: Install browser for inventory flows
        run: npx playwright install --with-deps chromium
      - name: Inventory desktop and Android browser flows
        run: npm run test:inventory:e2e
      - name: Browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-browser-evidence
          path: |
            test-results/inventory
            playwright-report/inventory
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production security audit
        run: |
          npm audit --omit=dev --json > audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const vulnerabilities = audit.vulnerabilities || {};
          const important = Object.entries(vulnerabilities)
            .filter(([, info]) => info && (info.severity === 'critical' || info.severity === 'high'))
            .sort((a, b) => {
              const weight = { critical: 2, high: 1 };
              return (weight[b[1].severity] || 0) - (weight[a[1].severity] || 0);
            });

          console.log('=== Production audit summary ===');
          console.log(audit.metadata?.vulnerabilities || {});

          for (const [name, info] of important) {
            const via = Array.isArray(info.via)
              ? info.via.map(item => typeof item === 'string' ? item : item?.title || item?.source).filter(Boolean)
              : [];
            console.log(`${String(info.severity).toUpperCase()}: ${name}`);
            if (via.length) console.log(`  via: ${via.join(' | ')}`);
            if (info.fixAvailable) console.log(`  fixAvailable: ${JSON.stringify(info.fixAvailable)}`);
          }

          if ((audit.metadata?.vulnerabilities?.critical || 0) > 0) {
            process.exitCode = 1;
          }
          NODE
        continue-on-error: true

      - name: Check for secrets
        run: |
          if git diff HEAD~1 --name-only 2>/dev/null | xargs grep -l -E '(ghp_|AIza|sk-|xoxb-|PK[0-9])' 2>/dev/null; then
            echo "::warning::Posibles secrets detectados en el diff"
          fi
        continue-on-error: true
