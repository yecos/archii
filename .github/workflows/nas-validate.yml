name: NAS Validate

on:
  pull_request:
    branches: [main]

jobs:
  build-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
