name: Patch Next PostCSS

on:
  push:
    branches:
      - security/tenant-hardening-2026-09

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[postcss-override]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/tenant-hardening-2026-09

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pin patched PostCSS transitively
        run: |
          npm pkg set overrides.postcss=8.5.28
          npm install --package-lock-only

      - name: Commit override
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No PostCSS override changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: override patched PostCSS"
          git push origin HEAD:security/tenant-hardening-2026-09
