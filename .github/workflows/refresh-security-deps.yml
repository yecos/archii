name: Refresh security dependencies

on:
  push:
    branches:
      - security/tenant-hardening-2026-09

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[refresh-deps]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/tenant-hardening-2026-09

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Upgrade patched Next.js line
        run: npm install next@15.5.26 eslint-config-next@15.5.26 --save-exact

      - name: Commit lockfile refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: update Next.js to 15.5.26"
          git push origin HEAD:security/tenant-hardening-2026-09
