name: Refresh PDF dependencies

on:
  push:
    branches:
      - security/tenant-hardening-2026-09

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[pdf-deps]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/tenant-hardening-2026-09

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Upgrade PDF dependencies
        run: npm install jspdf@4.2.1 jspdf-autotable@5.0.8 --save-exact

      - name: Apply compatible lockfile patches
        run: npm audit fix --package-lock-only || true

      - name: Commit dependency refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: update PDF dependencies"
          git push origin HEAD:security/tenant-hardening-2026-09
